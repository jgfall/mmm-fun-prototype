<style>
/* Layout: the Pen frames run full-bleed at native 1440 scaled to the viewport; a single dark dock floats bottom-centre as the presenter's remote. */

<script>
const $=id=>document.querySelector('[data-pencil-id="'+id+'"]');
const STEPS=[
 {s:'p01',lv:1,k:'Level 1 · first visit',h:'Empty wallet. Tap <b>Load FLY to start</b> in Quick Swap.',t:['eNLhr','wVN2g','cUimR']},
 {s:'p01',m:'m_load',lv:1,k:'Level 1 · load FLY',h:'Pick an amount and payment method, then <b>Pay</b>.',t:['h8Rww']},
 {s:'p03',lv:1,k:'Level 1 · first order',h:'Wallet loaded. 25 FLY → 390.6 $BREW is ready. Tap <b>Place order</b>.',t:['BIDlO']},
 {s:'p03',m:'m_receipt',lv:1,k:'Level 1 · order up',h:'Two punches earned. Tap <b>View my bag</b>.',t:['JygPu','loZEX']},
 {s:'p05',lv:1,k:'Level 1 · authed home',h:'Bag is up to $62.47. Tap <b>Place order</b> to keep trading.',t:['GeXOi'],count:['z0HaI4',25,62.47]},
 {s:'p05',m:'m_l2',lv:2,k:'Promotion · level 2',h:'Crossed $100. Tap <b>Enter STARBAGS</b>.',t:['PS03E']},
 {s:'p07',lv:2,k:'Level 2 · Starbags',h:'New house, new menu. Tap <b>Place order</b> to keep trading.',t:['ZRS2P'],count:['a2Rla',62.47,486.20]},
 {s:'p07',m:'m_l3',lv:3,k:'Promotion · level 3',h:'Crossed $1K. Tap <b>Enter SWEETGREED</b>.',t:['UseLD']},
 {s:'p08',lv:3,k:'Level 3 · Sweetgreed',h:'Tap <b>Place order</b> to keep trading.',t:['A6xeu'],count:['R5puW',486.20,4812.55]},
 {s:'p08',m:'m_l4',lv:4,k:'Promotion · level 4',h:'Crossed $10K. Tap <b>Enter CARBONUS</b>.',t:['k6WVO']},
 {s:'p09',lv:4,k:'Level 4 · Carbonus',h:'Tap <b>Place order</b> to keep trading.',t:['maRHX'],count:['ZhLOq',4812.55,38450]},
 {s:'p09',m:'m_l5',lv:5,k:'Promotion · level 5',h:'Crossed $100K. Tap <b>Enter NOBULL</b>.',t:['LUYq1']},
 {s:'p10',lv:5,k:'Level 5 · Nobull',h:'Top tier. That’s the full ladder: McDoughnald’s → Nobull. Tap <b>Confirm order</b> to visit the merch store.',t:['Ia5IZ'],count:['f6Idb',38450,128940]},
 {s:'supply',lv:6,k:'mmm.supply · merch store',h:'Scroll, drag or use ← → to move along the line. Add merch to your bag, or tap a locked drop.',t:[],end:true},
];
const LVSTART={1:0,2:6,3:8,4:10,5:12,6:13};
let cur=0, zoom=1;

function fit(){
  const vw=document.documentElement.clientWidth, isSup=STEPS[cur]&&STEPS[cur].s==='supply';
  zoom=Math.min(1,vw/1440);
  if(isSup) zoom=Math.min(zoom,Math.max(.35,innerHeight/1026));
  const st=document.getElementById('stage');
  st.style.transform='scale('+zoom+')';
  st.style.marginLeft=isSup?Math.max(0,(vw-1440*zoom)/2)+'px':'0px';
  const on=st.querySelector('.screen.on');
  st.style.height=(on?on.offsetHeight*zoom:0)+'px';
  sizeModal();
  if(typeof tickSpeed==='function')tickSpeed();
  centreBadges();
}
/* Today's Special badges: move the designed tilt's pivot from top-left to centre (same placement) so hover zoom grows from the middle */
function centreBadges(){
  document.querySelectorAll('.screen.on [data-pencil-name="Price Sticker"],.screen.on [data-pencil-name="Change Burst"],.screen.on [data-pencil-name="Rank"]').forEach(b=>{
    if(b.dataset.cz||!b.offsetWidth) return;
    const m=(b.style.transform||'').match(/rotate\(([-\d.]+)deg\)/), deg=m?+m[1]:0;
    const cx=b.offsetWidth/2, cy=b.offsetHeight/2;
    b.style.transformOrigin=cx+'px '+cy+'px';
    b.style.transform='translate('+(-cx)+'px,'+(-cy)+'px) rotate('+deg+'deg) translate('+cx+'px,'+cy+'px)';
    b.classList.add('badge'); b.dataset.cz=1;
  });
}
function sizeModal(){
  const m=document.querySelector('.modal.on'); if(!m) return;
  const w=m.offsetWidth,h=m.offsetHeight;
  const z=Math.min(1,(innerWidth-32)/w,(innerHeight-190)/h);
  const wrap=document.getElementById('modalWrap');
  wrap.style.width=w*z+'px'; wrap.style.height=h*z+'px';
  m.style.transform='scale('+z+')'; m.style.transformOrigin='0 0';
}
function fmt(v,dec){return '$'+v.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec})}
function countUp(id,from,to){
  const el=$(id); if(!el) return;
  const txt=el.textContent; const dec=(txt.split('.')[1]||'').replace(/\D/g,'').length;
  const t0=performance.now(),d=1300;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function f(t){const p=reduce?1:Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e,dec);if(p<1)requestAnimationFrame(f)}
  requestAnimationFrame(f);
}

  SEG.forEach((g,i)=>{ if(!g.track) return; if(!g.fill){g.fill=document.createElement('div');g.fill.setAttribute('style',SEG[0].fill.getAttribute('style'));g.track.appendChild(g.fill);} g.fill.style.width='0px'; g.track.style.position='relative'; g.track.style.overflow='hidden'; });
  const segEls=['p1OmN','kKorE','z2k5Cb','ZBScQ'].map(q);
  ['wspCV','f8YNLU','WC525','c8Fv8T'].forEach((id,i)=>SEG[i].lbl=q(id));
  let sx=0,tx=0,vel=0,raf=0,active=false,t0=performance.now();
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  /* pivot helper: re-express a top-left rotation around (px,py) so new rotate/scale pivot there */
  function pivot(el,fx,fy){ if(!el||el.dataset.pv||!el.offsetWidth) return; const m=(el.style.transform||'').match(/rotate\(([-\d.]+)deg\)/),d=m?+m[1]:0;
    const cx=el.offsetWidth*fx, cy=el.offsetHeight*fy; el.style.transformOrigin=cx+'px '+cy+'px';
    el.style.transform='translate('+(-cx)+'px,'+(-cy)+'px) rotate('+d+'deg) translate('+cx+'px,'+cy+'px)'; el.dataset.pv=1; }
  const tags=['Fg4l4','R1V797','hJI3T','Yxc6q','kgMCl'].map(q).filter(Boolean).map((el,i)=>({el,a:0,ph:i*1.7,sp:.9+i*.13}));
  /* reveal groups: element ids, the x where they enter, pop or slide */
  const groups=[
    {x:0,ids:['YGRax','eoOkW','VJcgr','p6EVh8','G5Gby','Y0JZIS','sHw7E','uMX3k','JECUy']},
    {x:1640,ids:['g7JE7e','h4PGE7','mhAfA','wIMt7','ErS7a','PpDOs','f7xSbj','CD0jL'],pop:['mhAfA','ErS7a','wIMt7','PpDOs']},
    {x:3120,ids:['eSiSj','UB1lK','SlKTT','vtKJW','d77pFD','Dp31O','mryLB','jAPfP','uKzNh','xgvPp','ZdssP']},
    {x:5080,ids:['iOKbD','dvoBy','N2IYpL']}];
  groups.forEach(g=>g.els=g.ids.map(q).filter(Boolean));
  function resetReveal(){groups.forEach(g=>{g.shown=false;g.els.forEach((e,k)=>{e.classList.remove('sv-in');e.classList.add('sv-pre');if(g.pop&&g.pop.includes(e.dataset.pencilId))e.classList.add('sv-pop');e.style.setProperty('--sd',(k*0.07)+'s');})})}
  function reveal(){groups.forEach(g=>{if(!g.shown&&sx+VIEW*0.78>g.x){g.shown=true;g.els.forEach(e=>e.classList.add('sv-in'))}})}
  function setup(){ ['mhAfA','ErS7a'].forEach(id=>{const e=q(id);pivot(e,.5,.5);e&&e.classList.add('sv-hov')});
    tags.forEach(t=>pivot(t.el,.5,0)); ['wIMt7','PpDOs'].forEach(id=>{const e=q(id);pivot(e,.5,.5);e&&e.classList.add('sv-hov')}); }
  function frame(now){
    const prev=sx; sx+= (tx-sx)*0.12; if(Math.abs(tx-sx)<.1) sx=tx;
    const v=sx-prev; vel=vel*0.85+v*0.15;
    strip.style.transform='translateX('+(-sx)+'px)'; rail.style.transform='translateX('+(-sx)+'px)';
    SEG.forEach(g=>{ if(g.fill){ const tw=g.track.offsetWidth; const p=clamp((sx-g.x+VIEW*0.35)/g.w,0,1); g.fill.style.width=(p*tw)+'px'; }
      if(g.lbl){ const lw=g.lbl.offsetWidth; g.lbl.style.translate=clamp(sx-g.x,0,Math.max(0,g.w-64-lw))+'px 0'; } });
    const t=(now-t0)/1000;
    tags.forEach(o=>{ const target=clamp(-vel*0.9,-14,14); o.a+= (target-o.a)*0.07; o.el.style.rotate=(Math.sin(t*o.sp+o.ph)*1.3+o.a).toFixed(2)+'deg'; });
    reveal(); if(active) raf=requestAnimationFrame(frame);
  }
  function to(x){tx=clamp(x,0,MAX)}
  function enter(){ if(active) return; active=true; sx=tx=0; strip.style.transform=rail.style.transform='translateX(0)'; resetReveal(); requestAnimationFrame(()=>{setup();raf=requestAnimationFrame(frame)}); }
  function leave(){ active=false; cancelAnimationFrame(raf); }
  /* wheel / trackpad */
  addEventListener('wheel',e=>{ if(!active||document.getElementById('overlay').classList.contains('on')) return;
    const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY; const k=e.deltaMode===1?40:1;
    if((d>0&&tx<MAX)||(d<0&&tx>0)){e.preventDefault(); to(tx+d*k/zoom*1.1);} },{passive:false});
  /* drag with inertia */
  let drag=null;
  scr.addEventListener('pointerdown',e=>{ if(e.button!==0||e.target.closest('.sv-click,.hot')) return; drag={x:e.clientX,tx,last:e.clientX,v:0,moved:false}; scr.setPointerCapture(e.pointerId); scr.classList.add('dragging'); });
  scr.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x; if(Math.abs(dx)>4)drag.moved=true; drag.v=e.clientX-drag.last; drag.last=e.clientX; to(drag.tx-dx/zoom); });
  const end=e=>{ if(!drag) return; to(tx-drag.v*14/zoom); scr.classList.remove('dragging'); scr._moved=drag.moved; drag=null; };
  scr.addEventListener('pointerup',end); scr.addEventListener('pointercancel',end);
  /* clicks */
  const on=(id,fn)=>{const e=q(id); if(e){e.classList.add('sv-click'); e.addEventListener('click',ev=>{ev.stopPropagation(); if(scr._moved){scr._moved=false;return} fn(e,ev)})}};
  segEls.forEach((e,i)=>e&&on(e.dataset.pencilId,()=>to(SEG[i].x)));
  on('g7wgS',()=>to(1640)); on('wfLs1',()=>to(0)); on('Irdca',()=>to(0));
  on('ZsEkn',()=>to(1640)); on('rF9Gn',()=>to(3120)); on('a2bo3Z',()=>to(0));
  let bag=0; const bagLbl=q('qPYpj'), bagBtn=q('keKVu');
  const add=name=>{ bag++; if(bagLbl) bagLbl.textContent='Bag · '+bag; if(bagBtn){bagBtn.classList.remove('sv-bump');void bagBtn.offsetWidth;bagBtn.classList.add('sv-bump')} toast('Added '+name+' to your bag'); };
  on('zuEV7',()=>add('The First Order Tee')); on('El2IZ',()=>add('The Endless Arches Cap'));
  on('keKVu',()=>toast(bag?('Your bag has '+bag+' item'+(bag>1?'s':'')+'. Checkout isn’t part of this prototype.'):'Your bag is empty. Add a tee or cap from the menu.'));
  const grow=()=>{ toast('Back to the McDoughnald’s menu to grow your bag'); go(4); };
  on('Z47UzE',grow); on('Ep9mD',grow);
  [['jAPfP','02'],['uKzNh','03'],['xgvPp','04'],['ZdssP','05'],['R1V797','02'],['hJI3T','03'],['Yxc6q','04'],['kgMCl','05']].forEach(([id,l])=>on(id,el=>{
    const tgt=el.dataset.pencilName.includes('tag')?el.querySelector('[data-pencil-name="Tag body"]')||el:el;
    tgt.classList.remove('sv-shake'); void tgt.offsetWidth; tgt.classList.add('sv-shake'); toast('No peeking. This drop unlocks at Level '+l+'.'); }));
  return {enter,leave,key:dir=>{ if((dir>0&&tx<MAX)||(dir<0&&tx>0)){to(tx+dir*720);return true} return false; }};
})();

document.getElementById('next').onclick=()=>go(cur+1,{forward:true});
document.getElementById('back').onclick=()=>go(cur-1);
document.getElementById('restart').onclick=()=>go(0);
const UNLOCK={2:5,3:7,4:9,5:11,6:13};
document.querySelectorAll('.lv').forEach(b=>{b.dataset.name=b.querySelector('.nm').textContent;
  b.onclick=()=>{const l=+b.dataset.lv;go(l>STEPS[cur].lv?UNLOCK[l]:LVSTART[l],{forward:true})}});
addEventListener('keydown',e=>{if(e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;
  if((e.key==='h'||e.key==='H')&&!e.metaKey&&!e.ctrlKey&&!e.altKey){setDock(document.body.classList.contains('dock-off'));return}
  if(STEPS[cur].s==='supply'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')&&window.SUP&&SUP.key(e.key==='ArrowRight'?1:-1))return;
  if(e.key==='ArrowRight')go(cur+1,{forward:true});else if(e.key==='ArrowLeft')go(cur-1);else if(e.key==='Escape'&&STEPS[cur].m==='m_load')go(0)});
addEventListener('resize',fit);
document.fonts&&document.fonts.ready.then(fit);
addEventListener('load',fit);
go(0);
</script>
