<style>
/* Layout: the Pen frames run full-bleed at native 1440 scaled to the viewport; a single dark dock floats bottom-centre as the presenter's remote. */
:root{
  --dock-bg:#121110; --dock-line:#2b2926; --dock-fg:#f4efe6; --dock-dim:#9a948a;
  --l1:#DA291C; --l2:#00704A; --l3:#7FB069; --l4:#C9A86A; --l5:#F4EFE6;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace; --sans:Archivo,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:#0d0c0b;margin:0}
body{overflow-x:hidden;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
#stage{width:1440px;transform-origin:0 0}
body.m #stage{width:390px}
.screen{display:none!important}
.screen.on{display:flex!important;animation:fadeIn .35s ease both}
body.m #stage{box-shadow:0 0 0 1px #2b2926,0 30px 80px rgba(0,0,0,.5)}
@media (max-width:699px){body.m #stage{box-shadow:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.hot{cursor:pointer;transition:filter .15s,transform .15s}
.hot:hover{filter:brightness(1.07)}
.hot:active{transform:translateY(1px)}
.pulse{animation:pulse 1s ease 2}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,214,0,0)}40%{box-shadow:0 0 0 8px rgba(255,214,0,.85)}}

#overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;overflow:auto;padding:24px 16px calc(150px + env(safe-area-inset-bottom,0px))}
#overlay.on{opacity:1;pointer-events:auto}
#modalWrap{transform-origin:center;transition:transform .45s cubic-bezier(.2,1.3,.4,1)}
#overlay:not(.on) #modalWrap{transform:translateY(24px) scale(.94)}
.modal{display:none}
.modal.on{display:block}
.lv .bar,.lv .nm,.lv .th{display:block}
.mq-view{flex:1 1 0;min-width:0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent)}
.mq-track{display:flex;align-items:center;width:max-content;animation:marquee 40s linear infinite}
.mq-track>*{flex-shrink:0}
.mq-view:hover .mq-track{animation-play-state:paused}
@keyframes marquee{to{transform:translateX(-50%)}}
[data-pencil-name="Price Sticker"]{animation:floatA 6.2s ease-in-out infinite}
[data-pencil-name="Change Burst"]{animation:floatB 7.6s ease-in-out -2s infinite}
[data-pencil-name="Rank"]{animation:floatC 5.4s ease-in-out -1s infinite}
.badge{transition:scale .28s cubic-bezier(.3,1.6,.5,1);cursor:default}
.badge:hover{scale:1.1}
@keyframes floatA{0%,100%{translate:0 0;rotate:0deg}50%{translate:2px -4px;rotate:1.2deg}}
@keyframes floatB{0%,100%{translate:0 0;rotate:0deg}33%{translate:-2px 3px;rotate:-2deg}66%{translate:2px 1px;rotate:1deg}}
@keyframes floatC{0%,100%{translate:0 0;rotate:0deg}50%{translate:3px -2px;rotate:-1deg}}
[data-screen="p03"] [data-pencil-name="Starburst"]{animation:none}
[data-pencil-name="Starburst"]{animation:burstPop .7s cubic-bezier(.3,1.5,.5,1) .35s both}
@keyframes burstPop{
  0%{opacity:0;scale:0;translate:52.33px 73.85px}
  55%{opacity:1;scale:1.18;translate:-9.42px -13.29px}
  78%{scale:.95;translate:2.62px 3.69px}
  100%{opacity:1;scale:1;translate:0 0}}
.screen>svg[data-pencil-name="Sunburst"]{transform-origin:50% 50%;animation:sunSpin 90s linear infinite;will-change:transform}
@keyframes sunSpin{to{transform:rotate(360deg)}}
/* receipt: printer slot, paper feed, torn bottom edge */
.modal[data-modal="m_receipt"]{position:relative;padding-top:20px}
.printer{position:absolute;top:0;left:-30px;right:-30px;height:40px;border-radius:14px;background:linear-gradient(#34312e,#151413 60%);box-shadow:0 10px 22px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.1);z-index:0;transition:transform .6s cubic-bezier(.55,0,.8,.2)}
.printer::after{content:"";position:absolute;left:18px;right:18px;top:18px;height:4px;border-radius:2px;background:#000;box-shadow:0 1px 0 rgba(255,255,255,.07)}
.feed{position:relative;z-index:1;overflow:hidden;margin:0 -40px -48px;padding:0 40px 48px;filter:drop-shadow(0 14px 16px rgba(0,0,0,.28));perspective:1600px}
.sheet{position:relative;transform-style:preserve-3d;transform-origin:0 0}
.sheet>.rcpt{box-shadow:none!important;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.paper-back{position:absolute;left:0;top:0;background:#F2F0E8;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-origin:0 0;pointer-events:none}
.paper-back .mpat{position:absolute;inset:0;pointer-events:none}
.paper-back .ghost{opacity:.06;filter:grayscale(1) blur(.3px);transform:scaleX(-1);transform-origin:50% 50%;width:100%;height:100%}
.paper-back .ghost *{animation:none!important}
.sheet>.rcpt,.paper-back{
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 9px) no-repeat,conic-gradient(from -45deg at 50% 100%,#000 90deg,#0000 0) bottom/18px 9px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 9px) no-repeat,conic-gradient(from -45deg at 50% 100%,#000 90deg,#0000 0) bottom/18px 9px repeat-x}
.feed.printing>.sheet{animation:feed .9s steps(18,end) both}
@keyframes feed{from{translate:0 -101%}to{translate:0 0}}
.modal.tearing .printer{transform:translateY(-1400px);transition-delay:.38s}
#overlay.ripping{overflow:hidden}
.modal.tearing .feed{overflow:visible;filter:none}
.modal.tearing .sheet>.rcpt,.modal.tearing .paper-back{
  -webkit-mask:conic-gradient(from 135deg at 50% 0,#000 90deg,#0000 0) top/18px 9px repeat-x,linear-gradient(#000 0 0) center/100% calc(100% - 18px) no-repeat,conic-gradient(from -45deg at 50% 100%,#000 90deg,#0000 0) bottom/18px 9px repeat-x;
  mask:conic-gradient(from 135deg at 50% 0,#000 90deg,#0000 0) top/18px 9px repeat-x,linear-gradient(#000 0 0) center/100% calc(100% - 18px) no-repeat,conic-gradient(from -45deg at 50% 100%,#000 90deg,#0000 0) bottom/18px 9px repeat-x}
.modal.tearing:not(.gl) .sheet{animation:rip 1.05s linear forwards}
.modal.tearing.gl .sheet{visibility:hidden}
.feed.glprint>.sheet{opacity:0}
#paperGL{position:fixed;left:0;top:0;z-index:55;pointer-events:none;display:none;filter:drop-shadow(0 18px 18px rgba(0,0,0,.28))}
/* grab the right edge and pull it across to the left: the sheet hinges on its left side, the right edge swings toward the viewer, the back comes round, then it is flung off-screen left */
@keyframes rip{
  0%{transform:none;animation-timing-function:ease-out}
  9%{transform:translateY(-8px) rotateZ(-1deg);animation-timing-function:cubic-bezier(.3,.8,.4,1)}
  26%{transform:translate(-6px,2px) rotateY(-28deg) rotateZ(3deg);animation-timing-function:ease-in-out}
  52%{transform:translate(-60px,24px) rotateY(-150deg) rotateZ(7deg);animation-timing-function:cubic-bezier(.45,0,.9,.5)}
  100%{transform:translate(-1700px,240px) rotateY(-185deg) rotateZ(-30deg)}}
@keyframes feed{from{translate:0 -101%}to{translate:0 0}}
/* ---------- mmm.supply lander ---------- */
[data-screen="supply"]{cursor:grab;touch-action:pan-y}
[data-screen="supply"].dragging{cursor:grabbing}
[data-screen="supply"] [data-pencil-id="JvoMd"],[data-screen="supply"] [data-pencil-id="QIe5r"]{will-change:transform}
[data-pencil-id="H0QA1S"]>*{animation:tickerRun 38s linear infinite}
@keyframes tickerRun{to{translate:-1571px 0}}
[data-pencil-name^="Pixelated"],[data-pencil-name^="Pixel"]{image-rendering:pixelated}
[data-pencil-id="f4zHxw"],[data-pencil-id="U7dWG"]{transform-origin:50% 50%;animation:burstSpin 24s linear infinite}
[data-pencil-id="U7dWG"]{animation-direction:reverse;animation-duration:30s}
@keyframes burstSpin{to{rotate:360deg}}
[data-pencil-name="Question mark"]{animation:qBob 2.6s ease-in-out infinite}
[data-pencil-name="Question mark"]:nth-of-type(odd){animation-delay:-1.3s}
@keyframes qBob{0%,100%{translate:0 0}50%{translate:0 -10px}}
[data-pencil-name^="Script ·"]{animation:scriptWig 4.5s ease-in-out infinite}
@keyframes scriptWig{0%,100%{rotate:0deg}50%{rotate:-2deg}}
[data-pencil-name^="Arrow ·"]{animation:arrowNudge 1.8s ease-in-out infinite}
@keyframes arrowNudge{0%,100%{translate:0 0}50%{translate:-6px 4px}}
[data-pencil-id="zTLLz"]{animation:cue 1.4s ease-in-out infinite;cursor:pointer}
@keyframes cue{0%,100%{translate:0 0}50%{translate:8px 0}}
.sv-float{animation:svFloat 5s ease-in-out infinite}
@keyframes svFloat{0%,100%{translate:0 0}50%{translate:0 -10px}}
.sv-hov{transition:scale .3s cubic-bezier(.3,1.6,.5,1)}
.sv-hov:hover{scale:1.04}
.sv-click{cursor:pointer}
.sv-pre{opacity:0;translate:0 50px}
.sv-pre.sv-pop{scale:.7}
.sv-in{opacity:1;translate:0 0;scale:1;transition:opacity .5s ease var(--sd,0s),translate .8s cubic-bezier(.2,1.35,.4,1) var(--sd,0s),scale .8s cubic-bezier(.2,1.35,.4,1) var(--sd,0s)}
.sv-shake{animation:svShake .5s ease}
@keyframes svShake{0%,100%{translate:0 0}20%{translate:-10px 0}40%{translate:9px 0}60%{translate:-6px 0}80%{translate:4px 0}}
.sv-bump{animation:svBump .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes svBump{0%{scale:1}40%{scale:1.18}100%{scale:1}}
.jw{display:inline-block;animation:jump .62s cubic-bezier(.3,1.65,.5,1) both;animation-delay:var(--d)}
@keyframes jump{0%{opacity:0;transform:translateY(55%) scale(.8) rotate(var(--r))}55%{opacity:1;transform:translateY(-16%) scale(1.04) rotate(calc(var(--r) * -1))}100%{opacity:1;transform:none}}
.slot.hit{animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{0%{opacity:0;scale:2.4;translate:0 -6px}55%{opacity:1;scale:.86;translate:0 0}100%{opacity:1;scale:1}}
.popT{animation:popT .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes popT{0%{scale:1}40%{scale:1.18}100%{scale:1}}
/* ---------- search the menu ---------- */
[data-pencil-name="Menu search"]{cursor:text;position:relative}
[data-pencil-name="Menu search"]:focus-within{box-shadow:0 0 0 3px rgba(255,255,255,.35),0 0 0 4px rgba(0,0,0,.18)}
[data-pencil-name="Menu search"].ms-line:focus-within{box-shadow:none;border-bottom-color:currentColor!important}
[data-pencil-name="Menu search"] [data-pencil-name="Placeholder"]{flex:1 1 0!important;width:auto!important;min-width:0}
.ms-in{all:unset;display:block;width:100%;font:inherit;color:inherit;letter-spacing:inherit;cursor:text}
.ms-in::placeholder{color:inherit;opacity:1}
.ms-in::-webkit-search-cancel-button{display:none}
.ms-drop{position:absolute!important;z-index:40;display:none!important;transform-origin:0 0}
.ms-drop.open{display:flex!important;animation:dropIn .22s cubic-bezier(.2,1.2,.4,1) both}
@keyframes dropIn{from{opacity:0;translate:0 -6px}to{opacity:1;translate:0 0}}
/* the exporter writes stroked rows as content-box at full width, which overhangs by their padding */
.ms-drop>*{box-sizing:border-box!important}
.ms-row{cursor:pointer}
.ms-row{transition:background-color .12s}
.ms-empty{padding:18px 20px;font:inherit;opacity:.7}
/* ---------- Add USDC: network and token dropdowns ---------- */
.dd{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;display:none;flex-direction:column;gap:2px;padding:6px;background:#fff;border:1.5px solid #000;border-radius:14px;box-shadow:0 14px 28px rgba(0,0,0,.18);animation:dropIn .18s cubic-bezier(.2,1.2,.4,1) both}
.dd.open{display:flex}
[data-pencil-name="QR"]{isolation:isolate}  /* its modules carry export z-indexes; keep them from poking through the menu */
.dd-opt{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;cursor:pointer}
.dd-opt:hover,.dd-opt:focus-visible{background:#FFF4D6}
.dd-opt:focus-visible{outline:2px solid #000;outline-offset:-2px}
.dd-opt.on{background:#FFF4D6}
.dd-t{display:flex;flex-direction:column;flex:1;min-width:0}
.dd-t b{font-weight:inherit}
.dd-t i{font:500 11px Archivo,system-ui,sans-serif;font-style:normal;color:#6F6F6F;letter-spacing:.2px}
.dd-ck{font:800 14px Archivo,system-ui,sans-serif;color:#DA291C;width:14px;text-align:center}
.dd-chev{transition:rotate .2s ease}
.dd-open .dd-chev{rotate:180deg}
[data-pencil-name="Select"].dd-open{box-shadow:0 0 0 3px #FFBC0D}
/* ---------- everything clickable feels clickable ---------- */
.tap{cursor:pointer;transition:transform .12s ease,filter .15s ease}
.tap:hover{filter:brightness(1.06)}
.tap:active{transform:scale(.97)}
.seg-item{cursor:pointer}
.chip-off{background-color:#fff!important;box-shadow:inset 0 0 0 1.5px var(--chip)!important}
.chip-off *{color:var(--chip)!important}
[data-amt]{cursor:text;outline:none;border-radius:6px;transition:box-shadow .15s}
[data-amt]:hover{box-shadow:0 0 0 2px rgba(0,0,0,.08)}
[data-amt]:focus{box-shadow:0 0 0 2px currentColor}
.flipped{rotate:180deg;transition:rotate .3s cubic-bezier(.3,1.5,.5,1)}
/* ---------- collapsible sections ---------- */
[data-pencil-name="Collapse Header"],.ct-head{cursor:pointer;user-select:none}
.ct-icon{transition:rotate .25s ease}
.ct-flip .ct-icon{rotate:180deg}
/* ---------- mobile: sheets rise from the bottom; tab bar sticks ---------- */
#overlay.sheet{align-items:flex-end;padding-left:0;padding-right:0;padding-top:0}
#overlay.sheet #modalWrap{transition:transform .45s cubic-bezier(.2,1,.3,1)}
#overlay.sheet:not(.on) #modalWrap{transform:translateY(60%)}
.screen[data-mode="m"]{overflow:clip!important}
.screen[data-mode="m"] [data-pencil-name="Tab Bar"]{position:sticky!important;bottom:var(--dock-h,0px);z-index:30}
.navlink{cursor:pointer}
/* ---------- STARBAGS hero: rippling siren rings ---------- */
[data-pencil-name="Siren rings"]{clip-path:inset(0)}
.ripples{position:absolute;left:0;top:0;z-index:0;pointer-events:none}
/* the moving rings replace the three still ones; reduced motion keeps the still design */

#dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;width:min(760px,calc(100vw - 24px));
  background:var(--dock-bg);color:var(--dock-fg);border:1px solid var(--dock-line);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.45);font-family:var(--sans);padding:12px 14px;display:grid;gap:10px}
#track{display:flex;gap:6px}
.lv{flex:1 1 0}

.btn{appearance:none;border:1px solid var(--dock-line);background:#1d1b19;color:var(--dock-fg);font:600 12px var(--mono);letter-spacing:.04em;padding:8px 11px;border-radius:8px;cursor:pointer;white-space:nowrap}

#dock{transition:opacity .25s,transform .3s cubic-bezier(.2,1,.4,1)}

  background:var(--dock-bg);color:var(--dock-fg);border:1px solid var(--dock-line);box-shadow:0 10px 24px rgba(0,0,0,.4);cursor:pointer;

<script>
const $=id=>document.querySelector('[data-pencil-id="'+id+'"]');
const scr=k=>document.querySelector('.screen[data-screen="'+k+'"]');
const mod=k=>document.querySelector('.modal[data-modal="'+k+'"]');
const byName=(root,n)=>root?[...root.querySelectorAll('[data-pencil-name="'+n+'"]')]:[];
const SEARCH_TIP=' Or try <b>Search the menu</b>: type “tun”.';
/* One walkthrough, two layouts. Desktop and mobile steps line up index for index, so switching keeps your place. */

    const cta=leaves(panel).find(e=>/ USDC$/.test(e.textContent.trim())&&/order|reserve/i.test(e.textContent));
    const p0=pa.textContent.trim(), g0=ga?ga.textContent.trim():'', c0=cta?cta.textContent.trim():'';
    const note=leaves(scope).find(e=>/^≈\s*[\d,.]+\s+\$\w+/.test(e.textContent.trim())), n0=note?note.textContent:'';
    const chips=[...panel.querySelectorAll('[data-pencil-name]')].map(e=>e._seg).filter(s=>s&&s.items.some(k=>/\$\d|super|max/i.test(k.textContent)))[0];
    function setPay(v,from){
      if(from!=='type') pa.textContent=fmtLike(p0,v);
      if(ga&&perUsdc) ga.textContent=fmtLike(g0,v*perUsdc);
      if(note&&ga&&perUsdc) note.textContent=n0.replace(/[\d,.]+(?=\s+\$)/,fmtLike(g0,v*perUsdc));
      if(cta) cta.textContent=c0.replace(/[\d,.]+(?= USDC$)/,v.toLocaleString('en-US',{maximumFractionDigits:2}));
      if(chips&&from!=='chip'){const k=chips.items.find(k=>{const t=k.textContent.trim();return /^\$[\d,.]+$/.test(t)?num(t)===v:bal&&/super|max/i.test(t)&&num(bal)===v});
        if(k) chips.select(k); else chips.items.forEach(i=>{if(i===chips.cur){chips.select(null)}})}
    }
    pa.dataset.amt='1'; pa.contentEditable='true'; pa.inputMode='decimal'; pa.spellcheck=false; pa.setAttribute('role','textbox'); pa.setAttribute('aria-label','You pay');
    pa.addEventListener('click',e=>e.stopPropagation());
    pa.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){e.preventDefault();pa.blur()}else if(e.key.length===1&&!/[\d.,]/.test(e.key)&&!e.metaKey&&!e.ctrlKey)e.preventDefault()});
    pa.addEventListener('input',()=>setPay(num(pa.textContent),'type'));
    pa.addEventListener('blur',()=>{pa.textContent=fmtLike(p0,num(pa.textContent))});
    if(chips){const k=chips.items.find(k=>/^\$[\d,.]+$/.test(k.textContent.trim())&&num(k.textContent)===num(p0)); if(k) chips.select(k)}   /* highlight the chip that matches the amount */
    if(chips) chips.items[0].parentElement.addEventListener('seg',e=>{const t=e.detail.textContent.trim();
      const v=/super|max/i.test(t)?(bal?num(bal):null):num(t); if(v!=null) setPay(v,'chip')});
    /* the place-order button sits at the foot of a card that stretches to the hero's height */
    for(let b=cta;b&&b.parentElement&&b.parentElement!==screen;b=b.parentElement){const h=b.parentElement;
      if(getComputedStyle(h).flexDirection==='column'&&/height:\s*(100%|[\d.]+px)/.test(h.getAttribute('style')||'')){b.style.marginTop='auto';break}}
  });
});

/* STARBAGS hero: the siren rings themselves ripple outward forever. Each band keeps the designed look:
   thickness about 14% of its radius, #00754A, most opaque near the middle and fading as it grows.
   Spacing matches the design (rings at r 320, 450, 590), so any frame reads like the still. */
document.querySelectorAll('[data-pencil-name="Siren rings"]').forEach(box=>{
  const NS='http://www.w3.org/2000/svg';
  const ring=[...box.children].find(c=>/^Ring /.test(c.dataset.pencilName||'')), cs=ring&&ring.style;
  const cx=cs?parseFloat(cs.left)+parseFloat(cs.width)/2:720, cy=cs?parseFloat(cs.top)+parseFloat(cs.height)/2:470;
  const R0=40, R1=1000, N=7, T=14;                       /* spawn and end radius, rings in flight, seconds per ring */
  const at=r=>((r-R0)/(R1-R0)).toFixed(3);
  const svg=document.createElementNS(NS,'svg'); svg.setAttribute('class','ripples'); svg.setAttribute('aria-hidden','true');
  svg.setAttribute('width',box.offsetWidth||1440); svg.setAttribute('height',box.offsetHeight||820);
  for(let i=0;i<N;i++){
    const c=document.createElementNS(NS,'circle');
    Object.entries({cx,cy,r:R0,fill:'none',stroke:'#00754A','stroke-opacity':0}).forEach(([k,v])=>c.setAttribute(k,v));
    const t={dur:T+'s',begin:(-T*i/N).toFixed(2)+'s',repeatCount:'indefinite'};
    [{attributeName:'r',values:R0+';'+R1},
     {attributeName:'stroke-width',values:(R0*.14)+';'+(R1*.14)},
     {attributeName:'stroke-opacity',values:'0;.3;.29;.18;0',keyTimes:'0;'+at(240)+';'+at(320)+';'+at(590)+';1'}]
      .forEach(a=>{const el=document.createElementNS(NS,'animate');Object.entries(Object.assign(a,t)).forEach(([k,v])=>el.setAttribute(k,v));c.appendChild(el)});
    svg.appendChild(c);
  }
  box.prepend(svg); box.classList.add('has-ripples');
});

/* ---------- mmm.supply: side-scroll controller ---------- */
window.SUP=(function(){
  const scr=document.querySelector('[data-screen="supply"]'); if(!scr) return null;
  const q=id=>scr.querySelector('[data-pencil-id="'+id+'"]');
  const strip=q('JvoMd'), rail=q('QIe5r'), VIEW=1440, MAX=5840-VIEW;
  const SEG=[{x:0,w:1640,fill:q('Rrlik'),track:q('qDsh2')},{x:1640,w:1480,track:q('iOVQL')},{x:3120,w:1960,track:q('dq7KB')},{x:5080,w:760,track:q('R4Cs0q')}];
  SEG.forEach((g,i)=>{ if(!g.track) return; if(!g.fill){g.fill=document.createElement('div');g.fill.setAttribute('style',SEG[0].fill.getAttribute('style'));g.track.appendChild(g.fill);} g.fill.style.width='0px'; g.track.style.position='relative'; g.track.style.overflow='hidden'; });
  const segEls=['Wy2QP','kc1Wl','dZkLC','tll44'].map(q);
  ['zkvVK','fGViz','nIWGG','q0YTO3'].forEach((id,i)=>SEG[i].lbl=q(id));
  let sx=0,tx=0,vel=0,raf=0,active=false,t0=performance.now();
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  /* pivot helper: re-express a top-left rotation around (px,py) so new rotate/scale pivot there */
  function pivot(el,fx,fy){ if(!el||el.dataset.pv||!el.offsetWidth) return; const m=(el.style.transform||'').match(/rotate\(([-\d.]+)deg\)/),d=m?+m[1]:0;
    const cx=el.offsetWidth*fx, cy=el.offsetHeight*fy; el.style.transformOrigin=cx+'px '+cy+'px';
    el.style.transform='translate('+(-cx)+'px,'+(-cy)+'px) rotate('+d+'deg) translate('+cx+'px,'+cy+'px)'; el.dataset.pv=1; }
  const tags=['Ukir5','SPJuR','X3Oa2','tsBtq','vikgr'].map(q).filter(Boolean).map((el,i)=>({el,a:0,ph:i*1.7,sp:.9+i*.13}));
  /* reveal groups: element ids, the x where they enter, pop or slide */
  const groups=[
    {x:0,ids:['S027i','E5FeUZ','h1y5g','CZWfb','ze5t5','lDTeM','B1BjUF','PqPwB','VqjtI']},
    {x:1640,ids:['ayGT9','gE2NL','cq6Fs','OSNAq','I8kra','EYVgu','L8G5O','FjBqQ'],pop:['cq6Fs','I8kra','OSNAq','EYVgu']},
    {x:3120,ids:['YJAwo','GdzIb','o6rIkC','IrMdF','iAPQQ','h4uNt','j1k6K','X75ZVm','NYX5w','ExEOZ','gb0Zn']},
    {x:5080,ids:['OiP81','pdwHX','IBKz8']}];
  groups.forEach(g=>g.els=g.ids.map(q).filter(Boolean));
  function resetReveal(){groups.forEach(g=>{g.shown=false;g.els.forEach((e,k)=>{e.classList.remove('sv-in');e.classList.add('sv-pre');if(g.pop&&g.pop.includes(e.dataset.pencilId))e.classList.add('sv-pop');e.style.setProperty('--sd',(k*0.07)+'s');})})}
  function reveal(){groups.forEach(g=>{if(!g.shown&&sx+VIEW*0.78>g.x){g.shown=true;g.els.forEach(e=>e.classList.add('sv-in'))}})}
  function setup(){ ['cq6Fs','I8kra'].forEach(id=>{const e=q(id);pivot(e,.5,.5);e&&e.classList.add('sv-hov')});
    tags.forEach(t=>pivot(t.el,.5,0)); ['OSNAq','EYVgu'].forEach(id=>{const e=q(id);pivot(e,.5,.5);e&&e.classList.add('sv-hov')}); }
  function frame(now){
    const prev=sx; sx+= (tx-sx)*0.12; if(Math.abs(tx-sx)<.1) sx=tx;
    const v=sx-prev; vel=vel*0.85+v*0.15;
    strip.style.transform='translateX('+(-sx)+'px)'; rail.style.transform='translateX('+(-sx)+'px)';
    SEG.forEach(g=>{ if(g.fill){ const tw=g.track.offsetWidth; const p=clamp((sx-g.x+VIEW*0.35)/g.w,0,1); g.fill.style.width=(p*tw)+'px'; }
      if(g.lbl){ const lw=g.lbl.offsetWidth; g.lbl.style.translate=clamp(sx-g.x,0,Math.max(0,g.w-64-lw))+'px 0'; } });
    const t=(now-t0)/1000;
    tags.forEach(o=>{ const target=clamp(-vel*0.9,-14,14); o.a+= (target-o.a)*0.07; o.el.style.rotate=(Math.sin(t*o.sp+o.ph)*1.3+o.a).toFixed(2)+'deg'; });
    reveal(); if(active) raf=requestAnimationFrame(frame);
  }
  function to(x){tx=clamp(x,0,MAX)}
  function enter(){ if(active) return; active=true; sx=tx=0; strip.style.transform=rail.style.transform='translateX(0)'; resetReveal(); requestAnimationFrame(()=>{setup();raf=requestAnimationFrame(frame)}); }
  function leave(){ active=false; cancelAnimationFrame(raf); }
  /* wheel / trackpad */
  addEventListener('wheel',e=>{ if(!active||document.getElementById('overlay').classList.contains('on')) return;
    const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY; const k=e.deltaMode===1?40:1;
    if((d>0&&tx<MAX)||(d<0&&tx>0)){e.preventDefault(); to(tx+d*k/zoom*1.1);} },{passive:false});
  /* drag with inertia */
  let drag=null;
  scr.addEventListener('pointerdown',e=>{ if(e.button!==0||e.target.closest('.sv-click,.hot')) return; drag={x:e.clientX,tx,last:e.clientX,v:0,moved:false}; scr.setPointerCapture(e.pointerId); scr.classList.add('dragging'); });
  scr.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x; if(Math.abs(dx)>4)drag.moved=true; drag.v=e.clientX-drag.last; drag.last=e.clientX; to(drag.tx-dx/zoom); });
  const end=e=>{ if(!drag) return; to(tx-drag.v*14/zoom); scr.classList.remove('dragging'); scr._moved=drag.moved; drag=null; };
  scr.addEventListener('pointerup',end); scr.addEventListener('pointercancel',end);
  /* clicks */
  const on=(id,fn)=>{const e=q(id); if(e){e.classList.add('sv-click'); e.addEventListener('click',ev=>{ev.stopPropagation(); if(scr._moved){scr._moved=false;return} fn(e,ev)})}};
  segEls.forEach((e,i)=>e&&on(e.dataset.pencilId,()=>to(SEG[i].x)));
  on('zTLLz',()=>to(1640)); on('aF59f',()=>to(0)); on('bgS2z',()=>to(0));
  on('l3idvF',()=>to(1640)); on('T4ILr',()=>to(3120)); on('tLhIl',()=>to(0));
  let bag=0; const bagLbl=q('y6AhoG'), bagBtn=q('uPDHF');
  const add=name=>{ bag++; if(bagLbl) bagLbl.textContent='Bag · '+bag; if(bagBtn){bagBtn.classList.remove('sv-bump');void bagBtn.offsetWidth;bagBtn.classList.add('sv-bump')} toast('Added '+name+' to your bag'); };
  on('T6K3y',()=>add('The First Order Tee')); on('Y3gWCT',()=>add('The Endless Arches Cap'));
  on('uPDHF',()=>toast(bag?('Your bag has '+bag+' item'+(bag>1?'s':'')+'. Checkout isn’t part of this prototype.'):'Your bag is empty. Add a tee or cap from the menu.'));
  const grow=()=>{ toast('Back to the McDoughnald’s menu to grow your bag'); go(4); };
  on('MCLT5',grow); on('k8uW7',grow);
  [['X75ZVm','02'],['NYX5w','03'],['ExEOZ','04'],['gb0Zn','05'],['SPJuR','02'],['X3Oa2','03'],['tsBtq','04'],['vikgr','05']].forEach(([id,l])=>on(id,el=>{
    const tgt=el.dataset.pencilName.includes('tag')?el.querySelector('[data-pencil-name="Tag body"]')||el:el;
    tgt.classList.remove('sv-shake'); void tgt.offsetWidth; tgt.classList.add('sv-shake'); toast('No peeking. This drop unlocks at Level '+l+'.'); }));
  return {enter,leave,key:dir=>{ if((dir>0&&tx<MAX)||(dir<0&&tx>0)){to(tx+dir*720);return true} return false; }};
})();
